<div class="main-container">
    <div class="glass-morphism">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-header">
                <div class="back-btn">
                    <img loading="lazy" src="../../../assets/svgs/back-arrow.svg" alt="back button">
                </div>
                <p class="para-xl">Login</p>
            </div>
            <div class="form-body">
                <!-- <div class="username-block">
                    <input type="text" class="" id="username" placeholder="Enter User Name" formControlName="username">
                    @if(loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty ||
                    loginForm.get('username')?.touched)){
                    <div class="text-danger">
                        Username is required.
                    </div>
                    }
                </div>
                <div class="password-block">
                    <input type="password" class="" id="password" placeholder="Enter Password"
                        formControlName="password">
                    @if(loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty ||
                    loginForm.get('password')?.touched)){
                    <div class="text-danger">
                        Password is required.
                    </div>
                    }
                </div> -->
                <!-- Username Field -->
                <mat-form-field appearance="outline" class="full-width pill" hideRequiredMarker>
                    <mat-label>Username / Email</mat-label>
                    <input matInput formControlName="username" />
                    <mat-error
                        *ngIf="loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)">
                        Username is required.
                    </mat-error>
                </mat-form-field>

                <!-- Password Field -->
                <mat-form-field appearance="outline" class="full-width" hideRequiredMarker>
                    <mat-label>Password</mat-label>
                    <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
                    <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                    <mat-error
                        *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
                        Password is required.
                    </mat-error>
                </mat-form-field>
                <div class="forgot-password-block">
                    <a class="link" href="#">Forgot Password ?</a>
                </div>
                <div class="form-cta">
                    <button type="submit" class="login-btn" [disabled]="loginForm.invalid">Login</button>
                    <p class="sign-up-block">
                        Create an account ?
                        <a class="link" routerLink="/register">Sign Up</a>
                    </p>
                    <!-- <div class="other-login">
                        <hr>
                        <p>Other Login Methods</p>
                        <app-sign-in-with-google (onGoogleLogin)="loginWithGoogle($event)"
                            (onError)="onLoginInError($event)"></app-sign-in-with-google>
                        <app-sign-in-with-facebook (onFBLogin)="loggedInWithFB($event)"
                            (onError)="onLoginInError($event)"></app-sign-in-with-facebook>
                    </div> -->
                    <div class="other-login-2">
                        <p class="or para-sm">OR</p>
                        <div class="btns">
                            <button type="button" class="d-flex sign-in-with-phone">
                                <em><i class="fa-solid fa-phone"></i></em>
                                <p>Sign in with Phone</p>
                            </button>
                            <app-sign-in-with-google [label]="'signin_with'" (onGoogleLogin)="loginWithGoogle($event)"
                                (onError)="onLoginInError($event)"></app-sign-in-with-google>
                            <!-- <app-sign-in-with-facebook (onFBLogin)="loggedInWithFB($event)"
                            (onError)="onLoginInError($event)"></app-sign-in-with-facebook> -->
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
